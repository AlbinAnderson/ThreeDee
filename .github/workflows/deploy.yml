name: Deploy

# Deploys main to the droplet after CI passes on it, or on demand (Actions tab
# -> Deploy -> Run workflow). The client is built here on GitHub, so the small
# droplet only unpacks, installs production dependencies and restarts.
#
# Repository (or `production` environment) secrets:
#   DEPLOY_HOST         droplet hostname or IP
#   DEPLOY_USER         SSH user on the droplet (e.g. deploy)
#   DEPLOY_SSH_KEY      private key whose public half is in that user's ~/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>`, so the droplet's identity is checked
# Optional repository/environment variable:
#   DEPLOY_PORT         SSH port if not 22

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to the droplet
    # Only after a successful CI run of a push to main (not a PR), or when started by hand.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PORT: ${{ vars.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build the client
        run: |
          npm ci
          npm run build

      - name: Package the release
        run: |
          git archive --format=tar -o release.tar HEAD
          tar -rf release.tar packages/client/dist
          gzip -9 release.tar
          ls -lh release.tar.gz

      - name: Set up SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in HOST DEPLOY_USER SSH_KEY KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret for deployment ($name). Configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, and DEPLOY_KNOWN_HOSTS."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            release.tar.gz "$DEPLOY_USER@$HOST:/tmp/tabletop-$SHA.tgz"
          scp -i ~/.ssh/deploy_key -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/deploy-remote.sh "$DEPLOY_USER@$HOST:/tmp/deploy-remote-$SHA.sh"

      - name: Install and restart on the droplet
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            "trap 'rm -f /tmp/deploy-remote-$SHA.sh' EXIT; bash /tmp/deploy-remote-$SHA.sh $SHA /tmp/tabletop-$SHA.tgz"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
